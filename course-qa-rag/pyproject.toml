[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-qa-rag"
version = "0.1.0"
description = "课程资料问答系统（检索增强生成 RAG）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rank-bm25>=0.2.2",
  "jieba>=0.42.1",
  "pypdf>=5.1.0",
  "python-dotenv>=1.0.1",
  "openai>=1.54.0",
  "streamlit>=1.39.0",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=3.0.0"]
pdf = ["reportlab>=4.2.5"]
dev = ["pytest>=8.0.0"]

[project.scripts]
course-qa = "course_qa.cli:main"

[tool.setuptools.packages.find]
include = ["course_qa*"]
